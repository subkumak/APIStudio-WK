kind: Plan
apiVersion: api.ibm.com/v1
metadata:
  name: GoldDistributor
  namespace: ZFPartnerAPIs
  version: '1.0'
  tags: []
  description: ''
spec:
  qos:
    withQuota:
      plan-limit:
        - $ref: ZFPartnerAPIs:Gold-ijqsxm:1.0
  termsOfService: >-
    Provides enhanced access to approved ZillaForge Partner APIs with higher
    service limits and increased throughput for business critical operations.
  extensions:
    dp-gateway:
      apiVersion: api.ibm.com/v1
      spec:
        apis:
          - $ref: ZFPartnerAPIs:Inventory-Partners:1.0
            operations:
              - path: /productcatalog
                method: get
              - path: /inventories
                method: get
          - $ref: ZFPartnerAPIs:Orders-Partners:1.0
            operations:
              - path: /salesorder
                method: post
              - path: /getOrder
                method: get
              - path: /orders
                method: get
              - path: /order
                method: get
          - $ref: ZFPartnerAPIs:Factory-Partners:1.0
            operations:
              - path: /devices
                method: get
              - path: /servicerequests
                method: get
