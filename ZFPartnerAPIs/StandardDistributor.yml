kind: Plan
apiVersion: api.ibm.com/v1
metadata:
  name: StandardDistributor
  namespace: ZFPartnerAPIs
  version: '1.0'
  tags: []
  description: ''
spec:
  qos:
    withQuota:
      plan-limit:
        - $ref: ZFPartnerAPIs:Standard-5r1scv:1.0
  termsOfService: >-
    Provides access to approved ZillaForge Partner APIs for standard business
    operations. Usage is subject to applicable quotas, rate limits, and partner
    agreements.
  extensions:
    dp-gateway:
      apiVersion: api.ibm.com/v1
      spec:
        apis:
          - $ref: ZFPartnerAPIs:Inventory-Partners:1.0
            operations:
              - path: /productcatalog
                method: get
              - path: /inventories
                method: get
          - $ref: ZFPartnerAPIs:Orders-Partners:1.0
            operations:
              - path: /salesorder
                method: post
              - path: /getOrder
                method: get
              - path: /orders
                method: get
              - path: /order
                method: get
          - $ref: ZFPartnerAPIs:Factory-Partners:1.0
            operations:
              - path: /devices
                method: get
              - path: /servicerequests
                method: get
