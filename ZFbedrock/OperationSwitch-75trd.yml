kind: OperationSwitch
apiVersion: api.ibm.com/v1
metadata:
  name: OperationSwitch-75trd
  namespace: ZFbedrock
  version: '1.0'
  tags: []
  labels:
    gatewayTypes:
      - nano
spec:
  cases:
    - conditions:
        - verbPath:
            path: /chat/completions
            verb: POST
      execute:
        - $ref: ZFbedrock:InvokeOpenAiChatCompletions-75trd:1.0
    - conditions:
        - verbPath:
            path: /embeddings
            verb: POST
      execute:
        - $ref: ZFbedrock:InvokeOpenAiEmbeddings-75trd:1.0
    - conditions:
        - verbPath:
            path: /models
            verb: GET
      execute:
        - $ref: ZFbedrock:InvokeOpenAiModels-75trd:1.0
    - conditions:
        - verbPath:
            path: /models/{a_model_id}
            verb: GET
      execute:
        - $ref: ZFbedrock:InvokeOpenAiModelsId-75trd:1.0
