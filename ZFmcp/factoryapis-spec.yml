openapi: 3.0.3
info:
  title: FactoryAPIs
  description: Factory APIs
  version: '1.0'
servers:
  - url: >-
      https://prod548489.a-vir-d1.apigw.ipaas.automation.ibm.com/gateway/SmartManufacturingAPIs/1
tags:
  - name: Manufacturing
security:
  - gatewayApiKey: []
paths:
  /devices:
    get:
      tags:
        - Manufacturing
      operationId: listDevices
      summary: List manufacturing devices
      description: Returns all manufacturing devices.
      responses:
        '200':
          description: Devices returned successfully
        '401':
          description: Access denied
  /servicerequests:
    get:
      tags:
        - Manufacturing
      operationId: listServiceRequests
      summary: List service requests
      description: Returns all manufacturing service requests.
      responses:
        '200':
          description: Service requests returned successfully
        '401':
          description: Access denied
components:
  securitySchemes:
    gatewayApiKey:
      type: apiKey
      in: header
      name: x-Gateway-APIKey
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
